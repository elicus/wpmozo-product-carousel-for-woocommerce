# Publishes the current state of `dev` to `main`, without development files.
#
# - `dev` keeps everything (src/, package.json, ...). All work and PRs go to `dev`.
# - `main` is generated by this workflow only. Do not commit or open PRs into `main`.
#
# Run it from GitHub: Actions -> "Publish dev to main (without src)" -> Run workflow.
# This file must also exist on `main` for the "Run workflow" button to appear;
# it is copied there automatically on every publish.

name: Publish dev to main (without src)

on:
  workflow_dispatch:
  # Uncomment to publish automatically on every push to dev:
  # push:
  #   branches: [dev]

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Create release commit on main without src
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Files and folders that must never reach main.
          git rm -r -q --cached --ignore-unmatch \
            src \
            package.json \
            package-lock.json \
            .DS_Store

          TREE=$(git write-tree)
          PARENT=$(git rev-parse origin/main)

          if [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
            echo "main is already up to date with dev."
            exit 0
          fi

          MSG="Release from dev: $(git log -1 --format=%s origin/dev)"
          COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          git push origin "$COMMIT:refs/heads/main"
          echo "Published $(git rev-parse --short "$COMMIT") to main."
